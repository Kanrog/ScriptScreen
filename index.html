<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptScreen</title>
    <link rel="icon" type="image/svg+xml" href="ss-icon.svg">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }
        #clear-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #222;
            color: #ff5555;
            border: 1px solid #444;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0.3;
            transition: opacity 0.3s, background 0.2s;
            z-index: 10;
        }
        #clear-btn:hover {
            opacity: 1;
            background: #444;
        }
        #message-area {
            flex-grow: 1;
            background-color: transparent;
            color: #fff;
            border: none;
            outline: none;
            font-family: sans-serif;
            font-size: 8vh;
            width: 100%;
            resize: none;
            word-wrap: break-word;
            white-space: pre-wrap;
            padding-top: 30px;
        }
        #footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        #footer:hover {
            opacity: 1;
        }
        .github-link {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            font-family: sans-serif;
        }
        .github-link:hover {
            color: #fff;
            text-decoration: underline;
        }
        #controls {
            display: flex;
            gap: 10px;
        }
        .control-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        .control-btn:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <button id="clear-btn" onclick="clearText()" title="Clear Screen (Delete Key)">CLEAR</button>
    <textarea id="message-area" autofocus spellcheck="false" placeholder="Type your message here..."></textarea>
    
    <div id="footer">
        <a href="https://github.com/kanrog/ScriptScreen" target="_blank" class="github-link">GitHub</a>
        <div id="controls">
            <button class="control-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
            <button class="control-btn" onclick="adjustSize(-1)" title="Smaller Text">A-</button>
            <button class="control-btn" onclick="adjustSize(1)" title="Larger Text">A+</button>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('message-area');
        
        let currentSize = localStorage.getItem('scriptScreenFontSize');
        if (currentSize) {
            textarea.style.fontSize = currentSize + 'vh';
        }

        function clearText() {
            textarea.value = '';
            textarea.focus();
        }

        // Listen for keys directly on the textarea
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Delete') {
                clearText();
            } else if (e.key === 'PageUp') {
                e.preventDefault();
                adjustSize(1); // Page Up increases text size
            } else if (e.key === 'PageDown') {
                e.preventDefault();
                adjustSize(-1); // Page Down decreases text size
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
            textarea.focus();
        }

        function adjustSize(change) {
            let currentVh = parseFloat(window.getComputedStyle(textarea).fontSize);
            let parentVh = parseFloat(window.getComputedStyle(textarea.parentElement).height);
            let currentVal = (currentVh / parentVh) * 100;
            
            let newVal = Math.max(3, Math.min(25, Math.round(currentVal + (change * 2))));
            textarea.style.fontSize = newVal + 'vh';
            
            localStorage.setItem('scriptScreenFontSize', newVal);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                textarea.focus();
            }
        });

        // Register Service Worker for Offline PWA Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered successfully with scope: ', registration.scope);
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
