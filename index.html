<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>ScriptScreen</title>
    <link rel="icon" type="image/svg+xml" href="ss-icon.svg">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 15px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        #message-area {
            flex-grow: 1;
            background-color: transparent;
            color: #fff;
            border: none;
            outline: none;
            font-family: sans-serif;
            font-size: 8vh;
            width: 100%;
            resize: none;
            word-wrap: break-word;
            white-space: pre-wrap;
            padding-top: 10px;
            transition: transform 0.3s ease;
        }
        #message-area.rotated {
            transform: rotate(180deg);
        }
        #footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            flex-shrink: 0;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        #footer:hover {
            opacity: 1;
        }
        .github-link {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            font-family: sans-serif;
        }
        .github-link:hover {
            color: #fff;
            text-decoration: underline;
        }
        #controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
        }
        .control-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
        }
        .control-btn:hover {
            background: #444;
        }
        #voice-select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }
        #voice-select:hover {
            background: #444;
        }
        #history-select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            max-width: 110px;
        }
        #history-select:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <textarea id="message-area" autofocus spellcheck="false" placeholder="Type your message here..."></textarea>
    
    <div id="footer">
        <a href="https://github.com/kanrog/ScriptScreen" target="_blank" class="github-link">GitHub</a>
        <div id="controls">
            <button class="control-btn" id="speak-btn" onclick="speakText()" title="Speak Text (Ctrl+Enter)">Speak</button>
            <select id="voice-select" title="Select Voice"></select>
            <select id="history-select" title="Recent Messages" onchange="loadHistoryItem(this)">
                <option value="" disabled selected>History</option>
            </select>
            <button class="control-btn" onclick="toggleRotate()" title="Rotate 180° for Face-to-Face">180°</button>
            <button class="control-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
            <button class="control-btn" onclick="adjustSize(-1)" title="Smaller Text (Page Down)">A-</button>
            <button class="control-btn" onclick="adjustSize(1)" title="Larger Text (Page Up)">A+</button>
            <button class="control-btn" onclick="clearText()" title="Clear Screen (Delete Key)" style="color: #ff5555; font-weight: bold;">Clear</button>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('message-area');
        const voiceSelect = document.getElementById('voice-select');
        const historySelect = document.getElementById('history-select');
        let voices = [];
        
        let currentSize = localStorage.getItem('scriptScreenFontSize');
        if (currentSize) {
            textarea.style.fontSize = currentSize + 'vh';
        }

        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            
            if (voices.length === 0) {
                let option = document.createElement('option');
                option.textContent = 'Default Voice';
                voiceSelect.appendChild(option);
                return;
            }

            voices.forEach((voice, index) => {
                let option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });
        }

        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function updateHistoryDropdown() {
            let history = JSON.parse(localStorage.getItem('scriptScreenHistory') || '[]');
            historySelect.innerHTML = '<option value="" disabled selected>History</option>';
            
            history.forEach((item) => {
                let option = document.createElement('option');
                option.value = item;
                option.textContent = item.length > 25 ? item.substring(0, 25) + '...' : item;
                historySelect.appendChild(option);
            });
        }

        function saveToHistory(text) {
            if (!text || text.trim() === '') return;
            let history = JSON.parse(localStorage.getItem('scriptScreenHistory') || '[]');
            
            history = history.filter(item => item !== text);
            history.unshift(text);
            
            if (history.length > 10) {
                history.pop();
            }
            
            localStorage.setItem('scriptScreenHistory', JSON.stringify(history));
            updateHistoryDropdown();
        }

        function loadHistoryItem(selectElement) {
            if (selectElement.value) {
                textarea.value = selectElement.value;
                textarea.focus();
                selectElement.selectedIndex = 0;
            }
        }

        updateHistoryDropdown();

        function speakText() {
            if ('speechSynthesis' in window) {
                const text = textarea.value.trim();
                if (text) {
                    saveToHistory(text);
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    
                    const selectedIndex = voiceSelect.value;
                    if (voices[selectedIndex]) {
                        utterance.voice = voices[selectedIndex];
                    }
                    
                    window.speechSynthesis.speak(utterance);
                }
            } else {
                alert("Text-to-speech is not supported on this browser.");
            }
        }

        function clearText() {
            textarea.value = '';
            textarea.focus();
        }

        function toggleRotate() {
            textarea.classList.toggle('rotated');
            textarea.focus();
        }

        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Delete') {
                clearText();
            } else if (e.key === 'PageUp') {
                e.preventDefault();
                adjustSize(1);
            } else if (e.key === 'PageDown') {
                e.preventDefault();
                adjustSize(-1);
            } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                speakText();
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
            textarea.focus();
        }

        function adjustSize(change) {
            let currentVh = parseFloat(window.getComputedStyle(textarea).fontSize);
            let parentVh = parseFloat(window.getComputedStyle(textarea.parentElement).height);
            let currentVal = (currentVh / parentVh) * 100;
            
            let newVal = Math.max(3, Math.min(25, Math.round(currentVal + (change * 2))));
            textarea.style.fontSize = newVal + 'vh';
            
            localStorage.setItem('scriptScreenFontSize', newVal);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'SELECT') {
                textarea.focus();
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered successfully with scope: ', registration.scope);
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
