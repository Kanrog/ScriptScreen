<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="cb-icon.ico">
    <title>Communication Board</title>
    <!-- Embedded PWA Manifest via Data URI -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Communication Board","short_name":"CommBoard","start_url":"./","display":"standalone","background_color":"#000000","theme_color":"#000000"}'>
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }
        #message-area {
            flex-grow: 1;
            background-color: transparent;
            color: #fff;
            border: none;
            outline: none;
            font-family: sans-serif;
            font-size: 8vh; /* Default size */
            width: 100%;
            resize: none;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        #controls {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 10px;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        #controls:hover {
            opacity: 1;
        }
        .control-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        .control-btn:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <textarea id="message-area" autofocus spellcheck="false" placeholder="Type your message here..."></textarea>
    
    <div id="controls">
        <button class="control-btn" onclick="adjustSize(-1)" title="Smaller Text">A-</button>
        <button class="control-btn" onclick="adjustSize(1)" title="Larger Text">A+</button>
    </div>

    <script>
        const textarea = document.getElementById('message-area');
        
        // Load saved font size if available
        let currentSize = localStorage.getItem('commBoardFontSize');
        if (currentSize) {
            textarea.style.fontSize = currentSize + 'vh';
        }

        function adjustSize(change) {
            // Extract current numeric value from computed style or default to 8
            let currentVh = parseFloat(window.getComputedStyle(textarea).fontSize);
            let parentVh = parseFloat(window.getComputedStyle(textarea.parentElement).height);
            let currentVal = (currentVh / parentVh) * 100;
            
            let newVal = Math.max(3, Math.min(25, Math.round(currentVal + (change * 2))));
            textarea.style.fontSize = newVal + 'vh';
            
            // Save preference
            localStorage.setItem('commBoardFontSize', newVal);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                textarea.focus();
            }
        });
    </script>
</body>
</html>
