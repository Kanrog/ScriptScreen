<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptScreen</title>
    <!-- Custom Embedded SVG Icon matching SS logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M 448, 224 C 448, 332.25 358.25, 420 248, 420 C 217.5, 420 188.75, 412.75 163.5, 400 L 96, 432 L 124, 356 C 88.5, 321.25 64, 275.5 64, 224 C 64, 115.75 153.75, 28 264, 28 C 374.25, 28 448, 115.75 448, 224 Z' fill='%237b2cbf' stroke='%23000000' stroke-width='24' stroke-linejoin='round'/%3E%3Ctext x='50%25' y='53%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='190px' letter-spacing='5px'%3ESS%3C/text%3E%3C/svg%3E">
    
    <!-- Embedded PWA Manifest via Data URI -->
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
        }
        #clear-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #222;
            color: #ff5555;
            border: 1px solid #444;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0.3;
            transition: opacity 0.3s, background 0.2s;
            z-index: 10;
        }
        #clear-btn:hover {
            opacity: 1;
            background: #444;
        }
        #message-area {
            flex-grow: 1;
            background-color: transparent;
            color: #fff;
            border: none;
            outline: none;
            font-family: sans-serif;
            font-size: 8vh;
            width: 100%;
            resize: none;
            word-wrap: break-word;
            white-space: pre-wrap;
            padding-top: 30px; /* Prevents text from hiding under the clear button */
        }
        #footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        #footer:hover {
            opacity: 1;
        }
        .github-link {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            font-family: sans-serif;
        }
        .github-link:hover {
            color: #fff;
            text-decoration: underline;
        }
        #controls {
            display: flex;
            gap: 10px;
        }
        .control-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        .control-btn:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <button id="clear-btn" onclick="clearText()" title="Clear Screen">CLEAR</button>
    <textarea id="message-area" autofocus spellcheck="false" placeholder="Type your message here..."></textarea>
    
    <div id="footer">
        <a href="https://github.com/kanrog/ScriptScreen" target="_blank" class="github-link">GitHub</a>
        <div id="controls">
            <button class="control-btn" onclick="adjustSize(-1)" title="Smaller Text">A-</button>
            <button class="control-btn" onclick="adjustSize(1)" title="Larger Text">A+</button>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('message-area');
        
        let currentSize = localStorage.getItem('scriptScreenFontSize');
        if (currentSize) {
            textarea.style.fontSize = currentSize + 'vh';
        }

        function clearText() {
            textarea.value = '';
            textarea.focus();
        }

        function adjustSize(change) {
            let currentVh = parseFloat(window.getComputedStyle(textarea).fontSize);
            let parentVh = parseFloat(window.getComputedStyle(textarea.parentElement).height);
            let currentVal = (currentVh / parentVh) * 100;
            
            let newVal = Math.max(3, Math.min(25, Math.round(currentVal + (change * 2))));
            textarea.style.fontSize = newVal + 'vh';
            
            localStorage.setItem('scriptScreenFontSize', newVal);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                textarea.focus();
            }
        });
    </script>
</body>
</html>
