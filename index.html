<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>ScriptScreen</title>
    <link rel="icon" type="image/svg+xml" href="ss-icon.svg">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 15px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        #message-area {
            flex-grow: 1;
            background-color: transparent;
            color: #fff;
            border: none;
            outline: none;
            font-family: sans-serif;
            font-size: 8vh;
            width: 100%;
            resize: none;
            word-wrap: break-word;
            white-space: pre-wrap;
            padding-top: 10px;
            transition: transform 0.3s ease;
        }
        #message-area.rotated {
            transform: rotate(180deg);
        }
        #footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            flex-shrink: 0;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        #footer:hover {
            opacity: 1;
        }
        .github-link {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            font-family: sans-serif;
        }
        .github-link:hover {
            color: #fff;
            text-decoration: underline;
        }
        #controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .control-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
        }
        .control-btn:hover {
            background: #444;
        }
        #clear-ctrl {
            color: #ff5555;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <textarea id="message-area" autofocus spellcheck="false" placeholder="Type your message here..."></textarea>
    
    <div id="footer">
        <a href="https://github.com/kanrog/ScriptScreen" target="_blank" class="github-link">GitHub</a>
        <div id="controls">
            <button class="control-btn" id="speak-btn" onclick="speakText()" title="Speak Text">Speak</button>
            <button class="control-btn" onclick="toggleVoice()" title="Switch Voice">Voice: Auto</button>
            <button class="control-btn" onclick="toggleRotate()" title="Rotate 180° for Face-to-Face">180°</button>
            <button class="control-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
            <button class="control-btn" onclick="adjustSize(-1)" title="Smaller Text (Page Down)">A-</button>
            <button class="control-btn" onclick="adjustSize(1)" title="Larger Text (Page Up)">A+</button>
            <button class="control-btn" onclick="clearText()" title="Clear Screen (Delete Key)" style="color: #ff5555; font-weight: bold;">Clear</button>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('message-area');
        
        let currentSize = localStorage.getItem('scriptScreenFontSize');
        if (currentSize) {
            textarea.style.fontSize = currentSize + 'vh';
        }
        let voices = [];
        let selectedVoiceIndex = 0;

        // Browsers load voices asynchronously, so we listen for them to be ready
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
        }

        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();

        function toggleVoice() {
            if (voices.length === 0) {
                loadVoices();
            }
            if (voices.length === 0) {
                alert("No additional voices found on this device.");
                return;
            }

            // Cycle to the next available voice
            selectedVoiceIndex = (selectedVoiceIndex + 1) % voices.length;
            const currentVoice = voices[selectedVoiceIndex];
            
            // Update the button text to show a hint of the active voice name
            let shortName = currentVoice.name.split(' ')[0]; // Grab first word of voice name
            document.getElementById('speak-btn').title = `Voice: ${currentVoice.name}`;
            
            // Optional: give a quick visual cue on the voice button
            const voiceBtn = document.querySelectorAll('#controls button')[1];
            voiceBtn.textContent = `Voice: ${shortName}`;
        }

        function speakText() {
            if ('speechSynthesis' in window) {
                const text = textarea.value.trim();
                if (text) {
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    
                    // Apply the currently selected voice if available
                    if (voices.length > 0) {
                        utterance.voice = voices[selectedVoiceIndex];
                    }
                    
                    window.speechSynthesis.speak(utterance);
                }
            } else {
                alert("Text-to-speech is not supported on this browser.");
            }
        }
        function clearText() {
            textarea.value = '';
            textarea.focus();
        }

        function toggleRotate() {
            textarea.classList.toggle('rotated');
            textarea.focus();
        }
        function speakText() {
            if ('speechSynthesis' in window) {
                const text = textarea.value.trim();
                if (text) {
                    window.speechSynthesis.cancel(); // Cuts off any previous speech immediately
                    const utterance = new SpeechSynthesisUtterance(text);
                    window.speechSynthesis.speak(utterance);
                }
            } else {
                alert("Text-to-speech is not supported on this browser.");
            }
        }
        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Delete') {
                clearText();
            } else if (e.key === 'PageUp') {
                e.preventDefault();
                adjustSize(1);
            } else if (e.key === 'PageDown') {
                e.preventDefault();
                adjustSize(-1);
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
            textarea.focus();
        }

        function adjustSize(change) {
            let currentVh = parseFloat(window.getComputedStyle(textarea).fontSize);
            let parentVh = parseFloat(window.getComputedStyle(textarea.parentElement).height);
            let currentVal = (currentVh / parentVh) * 100;
            
            let newVal = Math.max(3, Math.min(25, Math.round(currentVal + (change * 2))));
            textarea.style.fontSize = newVal + 'vh';
            
            localStorage.setItem('scriptScreenFontSize', newVal);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                textarea.focus();
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered successfully with scope: ', registration.scope);
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
