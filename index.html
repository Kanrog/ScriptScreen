<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>ScriptScreen</title>
    <link rel="icon" type="image/svg+xml" href="ss-icon.svg">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 15px;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        #message-area {
            flex-grow: 1;
            background-color: transparent;
            color: #fff;
            border: none;
            outline: none;
            font-family: sans-serif;
            font-size: 8vh;
            width: 100%;
            resize: none;
            word-wrap: break-word;
            white-space: pre-wrap;
            padding-top: 10px;
            transition: transform 0.3s ease;
        }
        #message-area.rotated {
            transform: rotate(180deg);
        }
        #footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            flex-shrink: 0;
            opacity: 0.4;
            transition: opacity 0.3s;
        }
        #footer:hover {
            opacity: 1;
        }
        .github-link {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            font-family: sans-serif;
        }
        .github-link:hover {
            color: #fff;
            text-decoration: underline;
        }
        #controls {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
        }
        .control-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
        }
        .control-btn:hover {
            background: #444;
        }
        #voice-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #voice-btn:hover {
            background: #444;
        }
        #history-select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 8px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            max-width: 110px;
        }
        #history-select:hover {
            background: #444;
        }

        /* Custom Voice Modal Styling */
        #voice-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #voice-modal-content {
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #voice-modal-header {
            padding: 12px 15px;
            font-family: sans-serif;
            font-size: 15px;
            font-weight: bold;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #voice-modal-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
        }
        #voice-modal-close:hover {
            color: #fff;
        }
        #voice-list {
            overflow-y: auto;
            padding: 5px;
            margin: 0;
            list-style: none;
        }
        .voice-item {
            padding: 10px 12px;
            font-family: sans-serif;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            border-radius: 4px;
        }
        .voice-item:hover {
            background: #222;
        }
        .voice-item.selected {
            background: #333;
            color: #4da6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <textarea id="message-area" autofocus spellcheck="false" placeholder="Type your message here..."></textarea>
    
    <div id="footer">
        <a href="https://github.com/kanrog/ScriptScreen" target="_blank" class="github-link">GitHub</a>
        <div id="controls">
            <button class="control-btn" id="speak-btn" onclick="speakText()" title="Speak Text (Ctrl+Enter)">Speak</button>
            <button class="control-btn" id="voice-btn" onclick="openVoiceModal()" title="Select Voice">Voice</button>
            <select id="history-select" title="Recent Messages" onchange="loadHistoryItem(this)">
                <option value="" disabled selected>History</option>
            </select>
            <button class="control-btn" onclick="toggleRotate()" title="Rotate 180° for Face-to-Face">180°</button>
            <button class="control-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">⛶</button>
            <button class="control-btn" onclick="adjustSize(-1)" title="Smaller Text (Page Down)">A-</button>
            <button class="control-btn" onclick="adjustSize(1)" title="Larger Text (Page Up)">A+</button>
            <button class="control-btn" onclick="clearText()" title="Clear Screen (Delete Key)" style="color: #ff5555; font-weight: bold;">Clear</button>
        </div>
    </div>

    <!-- Voice Selection Modal Overlay -->
    <div id="voice-modal" onclick="closeVoiceModalOnClickOutside(event)">
        <div id="voice-modal-content">
            <div id="voice-modal-header">
                <span>Select Voice</span>
                <button id="voice-modal-close" onclick="closeVoiceModal()">&times;</button>
            </div>
            <ul id="voice-list"></ul>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('message-area');
        const voiceBtn = document.getElementById('voice-btn');
        const historySelect = document.getElementById('history-select');
        const voiceModal = document.getElementById('voice-modal');
        const voiceList = document.getElementById('voice-list');
        
        let voices = [];
        let selectedVoiceURI = localStorage.getItem('scriptScreenVoiceURI') || '';
        
        let currentSize = localStorage.getItem('scriptScreenFontSize');
        if (currentSize) {
            textarea.style.fontSize = currentSize + 'vh';
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                updateVoiceButtonLabel();
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
            setTimeout(loadVoices, 250);
            setTimeout(loadVoices, 1000);
        }

        function getSelectedVoice() {
            if (voices.length === 0) return null;
            let found = voices.find(v => v.voiceURI === selectedVoiceURI);
            return found || voices[0];
        }

        function updateVoiceButtonLabel() {
            let v = getSelectedVoice();
            if (v) {
                voiceBtn.textContent = v.name.length > 15 ? v.name.substring(0, 15) + '...' : v.name;
                voiceBtn.title = `Active Voice: ${v.name} (${v.lang})`;
            } else {
                voiceBtn.textContent = 'Voice';
            }
        }

        function buildVoiceModalList() {
            voices = window.speechSynthesis.getVoices();
            voiceList.innerHTML = '';
            
            if (voices.length === 0) {
                let li = document.createElement('li');
                li.className = 'voice-item';
                li.textContent = 'Loading voices... (Tap Speak once if empty)';
                voiceList.appendChild(li);
                return;
            }

            let currentVoice = getSelectedVoice();

            voices.forEach((voice) => {
                let li = document.createElement('li');
                let isSelected = currentVoice && voice.voiceURI === currentVoice.voiceURI;
                li.className = 'voice-item' + (isSelected ? ' selected' : '');
                li.textContent = `${voice.name} (${voice.lang})`;
                li.onclick = () => selectVoice(voice.voiceURI);
                voiceList.appendChild(li);
            });
        }

        function openVoiceModal() {
            loadVoices();
            buildVoiceModalList();
            voiceModal.style.display = 'flex';
        }

        function closeVoiceModal() {
            voiceModal.style.display = 'none';
            textarea.focus();
        }

        function closeVoiceModalOnClickOutside(e) {
            if (e.target === voiceModal) {
                closeVoiceModal();
            }
        }

        function selectVoice(uri) {
            selectedVoiceURI = uri;
            localStorage.setItem('scriptScreenVoiceURI', selectedVoiceURI);
            updateVoiceButtonLabel();
            closeVoiceModal();
        }

        function updateHistoryDropdown() {
            let history = JSON.parse(localStorage.getItem('scriptScreenHistory') || '[]');
            historySelect.innerHTML = '<option value="" disabled selected>History</option>';
            
            history.forEach((item) => {
                let option = document.createElement('option');
                option.value = item;
                option.textContent = item.length > 25 ? item.substring(0, 25) + '...' : item;
                historySelect.appendChild(option);
            });
        }

        function saveToHistory(text) {
            if (!text || text.trim() === '') return;
            let history = JSON.parse(localStorage.getItem('scriptScreenHistory') || '[]');
            
            history = history.filter(item => item !== text);
            history.unshift(text);
            
            if (history.length > 10) {
                history.pop();
            }
            
            localStorage.setItem('scriptScreenHistory', JSON.stringify(history));
            updateHistoryDropdown();
        }

        function loadHistoryItem(selectElement) {
            if (selectElement.value) {
                textarea.value = selectElement.value;
                textarea.focus();
                selectElement.selectedIndex = 0;
            }
        }

        updateHistoryDropdown();

        function speakText() {
            if ('speechSynthesis' in window) {
                const text = textarea.value.trim();
                if (text) {
                    saveToHistory(text);
                    window.speechSynthesis.cancel(); 
                    const utterance = new SpeechSynthesisUtterance(text);
                    
                    voices = window.speechSynthesis.getVoices();
                    let v = getSelectedVoice();
                    if (v) {
                        utterance.voice = v;
                    }
                    
                    window.speechSynthesis.speak(utterance);
                }
            } else {
                alert("Text-to-speech is not supported on this browser.");
            }
        }

        function clearText() {
            const text = textarea.value.trim();
            if (text) {
                saveToHistory(text);
            }
            textarea.value = '';
            textarea.focus();
        }

        function toggleRotate() {
            textarea.classList.toggle('rotated');
            textarea.focus();
        }

        textarea.addEventListener('keydown', (e) => {
            if (e.key === 'Delete') {
                clearText();
            } else if (e.key === 'PageUp') {
                e.preventDefault();
                adjustSize(1);
            } else if (e.key === 'PageDown') {
                e.preventDefault();
                adjustSize(-1);
            } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                speakText();
            }
        });

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
            textarea.focus();
        }

        function adjustSize(change) {
            let currentVh = parseFloat(window.getComputedStyle(textarea).fontSize);
            let parentVh = parseFloat(window.getComputedStyle(textarea.parentElement).height);
            let currentVal = (currentVh / parentVh) * 100;
            
            let newVal = Math.max(3, Math.min(25, Math.round(currentVal + (change * 2))));
            textarea.style.fontSize = newVal + 'vh';
            
            localStorage.setItem('scriptScreenFontSize', newVal);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A' && e.target.tagName !== 'SELECT' && !e.target.closest('#voice-modal')) {
                textarea.focus();
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered successfully with scope: ', registration.scope);
                    })
                    .catch((error) => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
